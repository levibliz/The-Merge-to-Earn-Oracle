[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin/=lib/openzeppelin-contracts/contracts/"
]
solc = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 10000

# See more config options: https://book.getfoundry.sh/reference/config/
