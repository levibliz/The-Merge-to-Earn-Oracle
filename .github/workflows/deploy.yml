name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-contract:
    name: Deploy Soroban Contract
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build contract WASM
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts

      - name: Install soroban-cli
        run: cargo install soroban-cli --locked

      - name: Deploy
        run: |
          soroban contract deploy \
            --wasm target/wasm32-unknown-unknown/release/wave_vault.wasm \
            --source ${{ secrets.DEPLOYER_SECRET_KEY }} \
            --rpc-url ${{ secrets.RPC_URL }} \
            --network-passphrase "${{ secrets.NETWORK_PASSPHRASE }}"
        working-directory: contracts
